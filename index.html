<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEYOND CHAT AI - PRO</title>
<style>
body{margin:0;background:#0e0e0e;color:#fff;font-family:sans-serif;display:flex}
.sidebar{width:230px;background:#161616;height:100vh;padding:15px}
.menu{padding:10px;border-radius:8px;cursor:pointer;margin:4px 0}
.menu:hover{background:#2a2a2a}
.active{background:#2a2a2a}
.main{flex:1;padding:15px}
.top button{background:#222;border:1px solid #333;color:#fff;padding:7px 14px;border-radius:20px;margin:3px;cursor:pointer}
.top .activeBtn{background:#fff;color:#000}
.chatBox{background:#1a1a1a;border-radius:12px;padding:15px;min-height:450px;overflow-y:auto}
input{width:100%;padding:14px;background:#222;border:none;border-radius:10px;color:#fff;margin-top:10px}
#send{width:100%;padding:14px;background:#fff;color:#000;font-weight:bold;border-radius:10px;margin-top:10px;border:none}
.user{ text-align:right; margin:10px 0 } .user span{background:#fff;color:#000;padding:8px 12px;border-radius:14px}
.ai{ background:#222;padding:10px;border-radius:10px;margin:10px 0 }
</style>
</head>
<body>
<div class="sidebar">
<h3>BEYOND CHAT AI</h3>
<div class="menu active">💬 AI Chat</div>
<div class="menu">📚 Study</div>
<div class="menu">🔬 Research</div>
<div class="menu">🧠 Deep Think</div>
<div class="menu">🎨 Create / Image</div>
<div class="menu">📁 Projects</div>
<div class="menu">📚 Library / Memory</div>
<div class="menu">🤖 Agents & Tools</div>
<div class="menu">🎙️ Voice</div>
<div class="menu">⚙️ Settings & Account</div>
</div>
<div class="main">
<div class="top">
<button onclick="setMode('study')" id="btn-study">Study</button>
<button onclick="setMode('research')" id="btn-research">Research</button>
<button onclick="setMode('deep')" id="btn-deep">Deep</button>
<button onclick="setMode('create')" id="btn-create">Create</button>
<button onclick="setMode('deep')" id="btn-think">Think</button>
<button onclick="setMode('chat')" id="btn-chat" class="activeBtn">Chat</button>
</div>
<h3 id="title">AI Chat - Chat Mode</h3>
<div class="chatBox" id="chat"><div class="ai">Hello! I am BEYOND CHAT AI PRO. All modes are active. Type your message in English.</div></div>
<input id="msg" placeholder="Type your message here...">
<button id="send" onclick="send()">Send</button>
</div>
<script>
let mode='chat';
const GROQ_KEY="PASTE_YOUR_GROQ_KEY_HERE";
function setMode(m){mode=m; document.getElementById('title').innerText="AI Chat - "+m.toUpperCase()+" Mode"; document.querySelectorAll('.top button').forEach(b=>b.classList.remove('activeBtn')); let b=document.getElementById('btn-'+m); if(b) b.classList.add('activeBtn');}
async function send(){
 let i=document.getElementById('msg'), c=document.getElementById('chat'), t=i.value.trim(); if(!t) return;
 c.innerHTML+=`<div class="user"><span>${t}</span></div>`; i.value=""; c.innerHTML+=`<div id="th" class="ai">BEYOND AI thinking in ${mode} mode...</div>`;
 if(mode==='create' || t.toLowerCase().includes('create image')){
  let u=`https://image.pollinations.ai/prompt/${encodeURIComponent(t)}?nologo=true`;
  document.getElementById('th').remove();
  c.innerHTML+=`<div class="ai">Image for: ${t}<br><img src="${u}" style="width:100%;max-width:400px;border-radius:10px;margin-top:8px"></div>`; return;
 }
 let sys={chat:"You are BEYOND CHAT AI helpful assistant. Answer in English.", study:"You are Study teacher. Explain step by step in English with examples.", research:"You are Research expert. Give deep research facts points in English.", deep:"You are Deep Think mode. Think logically step by step then answer in English."}[mode];
 try{
  let r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_KEY},body:JSON.stringify({model:"llama-3.1-8b-instant",messages:[{role:"system",content:sys},{role:"user",content:t}]})});
  let d=await r.json(); document.getElementById('th').remove();
  c.innerHTML+=`<div class="ai">${d.choices[0].message.content.replace(/\n/g,'<br>')}</div>`;
 }catch(e){ document.getElementById('th').innerHTML="Error: Add Groq API Key at top in GROQ_KEY. "+e; }
}
</script>
</body>
</html>
