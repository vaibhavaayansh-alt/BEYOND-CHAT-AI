<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BEYOND CHAT AI</title>
<script src="https://js.puter.com/v2/"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0b0c;--sidebar:#111112;--border:#2b2b2e;--text:#f5f5f5}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;height:100vh;overflow:hidden}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:20;transition:.25s}
.brand{padding:20px;font-weight:800;border-bottom:1px solid var(--border)}
.new-chat{margin:14px;padding:11px;border:1px solid var(--border);background:#19191a;border-radius:10px;color:#fff;cursor:pointer}
.history{flex:1;overflow-y:auto;padding:8px 10px}
.history-item{padding:9px 10px;color:#999;font-size:12px;border-radius:8px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item:hover,.history-item.active{background:#202022;color:#fff}
.main{margin-left:270px;height:100vh;display:flex;flex-direction:column}
.topbar{height:60px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px}
.menu{display:none;border:0;background:transparent;color:#fff;font-size:21px;cursor:pointer}
.content{flex:1;overflow-y:auto;padding:30px 20px 130px}
.hero{min-height:58vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.logo-orb{width:70px;height:70px;border-radius:22px;border:1px solid #3a3a3d;background:linear-gradient(145deg,#242426,#0e0e0f);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:22px}
.hero h1{font-size:42px;letter-spacing:-1px}.hero p{margin-top:12px;color:#888}
.cards{max-width:760px;width:100%;margin:20px auto 0;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{padding:16px;background:#121213;border:1px solid var(--border);border-radius:14px;cursor:pointer}
.chat{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px;width:100%}
.message{max-width:78%;font-size:14px;line-height:1.7}
.user-message{align-self:flex-end;background:#29292b;padding:11px 15px;border-radius:17px}
.ai-message{align-self:flex-start;width:100%}
.copy-btn{font-size:11px;padding:5px 10px;border-radius:8px;border:1px solid #2b2b2e;background:#19191a;color:#999;cursor:pointer;margin-top:8px}
.thinking{display:flex;gap:4px}.dot{width:6px;height:6px;background:#777;border-radius:50%;animation:bounce 1.4s infinite}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}
.composer-wrap{position:fixed;bottom:0;left:270px;right:0;padding:20px;background:linear-gradient(transparent,var(--bg) 35%)}
.composer{max-width:820px;margin:auto;background:#202022;border:1px solid #363638;border-radius:20px;padding:8px 15px;display:flex;gap:10px;align-items:center}
.composer input{flex:1;background:transparent;border:0;outline:none;color:#fff;padding:10px 0}
.send{width:35px;height:35px;border-radius:50%;border:0;background:#fff;font-weight:800;cursor:pointer}
@media(max-width:850px){.sidebar{left:-280px}.sidebar.open{left:0}.main{margin-left:0}.menu{display:block}.composer-wrap{left:0}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<aside class="sidebar" id="sidebar">
<div class="brand">◈ BEYOND CHAT AI</div>
<button class="new-chat" onclick="newChat()">＋ New chat</button>
<div style="padding:8px 12px;color:#666;font-size:10px;letter-spacing:1px">RECENT CHATS</div>
<div class="history" id="history"></div>
</aside>
<main class="main">
<header class="topbar"><button class="menu" onclick="toggleSidebar()">☰</button><b>BEYOND CHAT AI</b><span style="margin-left:auto;font-size:10px;color:#777">AI WORKSPACE • ONLINE</span></header>
<section class="content" id="content">
<div class="hero" id="hero"><div class="logo-orb">◈</div><h1>Think beyond the chat.</h1><p>Ask anything. Create anything.</p></div>
<div class="chat" id="chat"></div>
<div class="cards" id="cards">
<div class="card" onclick="quickAsk('What is AI in simple words?')"><b>💡 Explain AI</b><span>What is an AI?</span></div>
<div class="card" onclick="quickAsk('Give me startup ideas for 2026')"><b>🚀 Ideas</b><span>Startup ideas</span></div>
<div class="card" onclick="quickAsk('Write python snake game code')"><b>💻 Code</b><span>Build and debug</span></div>
<div class="card" onclick="quickAsk('Make study plan for exams')"><b>🎓 Study</b><span>Learn faster</span></div>
</div>
</section>
</main>
<div class="composer-wrap"><div class="composer"><input id="input" placeholder="Message Beyond Chat AI..."><button class="send" onclick="sendMessage()">↑</button></div></div>
<script>
let conversations=JSON.parse(localStorage.getItem("beyond_conversations")||"[]");
let currentId=localStorage.getItem("beyond_current")||null;
const chatEl=document.getElementById("chat"),hero=document.getElementById("hero"),cards=document.getElementById("cards"),historyEl=document.getElementById("history"),input=document.getElementById("input");
function md(t){return t.replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>')}
function save(){localStorage.setItem("beyond_conversations",JSON.stringify(conversations));if(currentId)localStorage.setItem("beyond_current",currentId)}
function getCurrent(){return conversations.find(c=>c.id===currentId)}
function renderHistory(){historyEl.innerHTML="";conversations.slice().reverse().forEach(c=>{const d=document.createElement("div");d.className="history-item"+(c.id===currentId?" active":"");d.textContent=c.title;d.onclick=()=>openChat(c.id);historyEl.appendChild(d)})}
function openChat(id){currentId=id;const conv=getCurrent();if(!conv)return;hero.style.display="none";cards.style.display="none";chatEl.innerHTML="";conv.messages.forEach(m=>addMessageUI(m.content,m.role,false));renderHistory();document.getElementById("sidebar").classList.remove("open")}
function addMessageUI(text,role){const w=document.createElement("div");w.className="message "+(role==="user"?"user-message":"ai-message");if(role==="user"){w.textContent=text}else{const c=document.createElement("div");c.innerHTML=md(text);w.appendChild(c);const b=document.createElement("button");b.className="copy-btn";b.textContent="⎙ Copy";b.onclick=()=>{navigator.clipboard.writeText(text);b.textContent="✓ Copied";setTimeout(()=>b.textContent="⎙ Copy",1200)};w.appendChild(b)}chatEl.appendChild(w);w.scrollIntoView({behavior:"smooth"});return w}
function newChat(){currentId=Date.now().toString();conversations.push({id:currentId,title:"New chat",messages:[]});chatEl.innerHTML="";hero.style.display="flex";cards.style.display="grid";save();renderHistory()}
async function askAIWithContext(allMessages){
  try{
    // Puter automatically handles auth safely, no key in code
    const response = await puter.ai.chat(allMessages, {model: "openai/gpt-4o-mini"});
    if(typeof response === "string") return response;
    if(response?.message?.content) return response.message.content;
    if(Array.isArray(response) && response[0]?.text) return response[0].text;
    return response.toString();
  }catch(e){
    console.log("Puter error, trying backup", e);
    try{
      let r=await fetch("https://ai.hackclub.com/proxy/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"qwen/qwen3-32b",messages:allMessages})});
      if(r.ok){let j=await r.json();return j.choices[0].message.content}
    }catch{}
    return "Bhai thoda busy hai, 5 sec baad fir se bolo.";
  }
}
async function sendMessage(){
  const text=input.value.trim();if(!text)return;
  if(!currentId||!getCurrent()){currentId=Date.now().toString();conversations.push({id:currentId,title:text.slice(0,32),messages:[]})}
  const conv=getCurrent();if(conv.messages.length===0)conv.title=text.slice(0,32);
  hero.style.display="none";cards.style.display="none";
  addMessageUI(text,"user");conv.messages.push({role:"user",content:text});input.value="";save();renderHistory();
  const think=document.createElement("div");think.className="message ai-message";think.innerHTML='<div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';chatEl.appendChild(think);
  // Full context bhej rahe hain ab
  const ans=await askAIWithContext(conv.messages);
  think.remove();addMessageUI(ans,"ai");conv.messages.push({role:"assistant",content:ans});save();renderHistory();
}
function quickAsk(t){input.value=t;sendMessage()}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open")}
input.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});
if(currentId&&getCurrent())openChat(currentId);else renderHistory();
</script>
</body>
</html>
